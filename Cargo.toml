[package]
name = "inferenceforge"
version = "0.1.0"
edition = "2021"
description = "Streaming inference gateway with bounded admission and worker failover"
repository = "https://github.com/sivajisj2/InferenceForge"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
subtle = "2"
